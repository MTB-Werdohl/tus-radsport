<!doctype html>

<html lang="de">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Termine Verwaltung</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <link rel="stylesheet"
        href="/assets/css/admin.css">

</head>

<body>

<div id="admin">

  <h1>
    Termine anlegen und bearbeiten
  </h1>

  <div class="admin-topbar">

    <input id="search"
           placeholder="Termine suchen..."
           oninput="loadEvents()">

    <button class="new-button"
            onclick="newEvent()">
      ➕ Neuer Termin
    </button>

  </div>

  <div id="events"></div>

</div>

<script>

const supabaseUrl =
  'https://eazizesytrnknbgrnggj.supabase.co';

const supabaseKey =
  'sb_publishable_Bz-kKI-XUf9Y1sM3hWIfAw_4l8fIPQr';

const supabaseClient =
  window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

async function loadEvents() {

  const { data, error } =
    await supabaseClient
      .from('Termine')
      .select('*')
      .order('id', {
        ascending: false
      });

  if (error) {

    console.error(error);

    return;

  }

  const search =
    document.getElementById('search')
      .value
      .toLowerCase();

  const container =
    document.getElementById('events');

  container.innerHTML = '';

  data
    .filter(event => {

      return (

        event.title
          ?.toLowerCase()
          .includes(search)

        ||

        event.location
          ?.toLowerCase()
          .includes(search)

      );

    })
    .forEach(event => {

      container.innerHTML += `

        <div class="event-card">

          <div class="event-header">

            <div>

              <strong>
                ${event.title}
              </strong>

              <div class="event-meta">

                ${event.recurring
                  ? '🔁 Wiederkehrend'
                  : `
                    📅 ${
                      new Date(event.date)
                        .toLocaleDateString('de-DE', {
                          day: '2-digit',
                          month: '2-digit',
                          year: 'numeric'
                        })
                    }

                    ·

                    🕒 ${
                      new Date(event.date)
                        .toLocaleTimeString('de-DE', {
                          hour: '2-digit',
                          minute: '2-digit'
                        })
                    } Uhr
                  `
                }

                ${event.location
                  ? ' · 📍 ' + event.location
                  : ''
                }

              </div>

            </div>

            <div class="actions">

              <button onclick="openEvent(${event.id})">
                ✏
              </button>

              <button class="delete-button"
                      onclick="deleteEvent(${event.id})">
                🗑
              </button>

            </div>

          </div>

        </div>

      `;

    });

}

async function deleteEvent(id) {

  const confirmDelete =
    confirm('Termin löschen?');

  if (!confirmDelete) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('Termine')
      .delete()
      .eq('id', id);

  if (error) {

    console.error(error);

    return;

  }

  loadEvents();

}

function newEvent() {

  window.location.href =
    '/admin/event.html';

}

function openEvent(id) {

  window.location.href =
    '/admin/event.html?id=' + id;

}

async function checkSession() {

  const { data } =
    await supabaseClient.auth
      .getSession();

  if (!data.session) {

    window.location.href =
      '/admin/';

    return;

  }

  loadEvents();

}

checkSession();

</script>

</body>

</html>
