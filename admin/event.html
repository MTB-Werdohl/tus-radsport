<!doctype html>

<html lang="de">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Termin bearbeiten</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <link rel="stylesheet"
        href="/assets/css/admin.css">

</head>

<body>

<h1 id="form-title">
  Neuer Termin
</h1>

<input id="title"
       placeholder="Titel">

<label>

  <input id="recurring"
         type="checkbox"
         class="checkbox"
         onchange="toggleRecurring()">

  Wiederkehrender Termin

</label>

<div id="singleFields">

  <div class="row">

    <input id="date"
           type="datetime-local">

    <input id="location"
           placeholder="Ort">

  </div>

</div>

<div class="row">

  <input id="category"
         placeholder="Kategorie">

  <div>

    <input id="imageFile"
           type="file"
           accept="image/*">

    <div id="currentImage"></div>

  </div>

</div>

<div class="row">

  <input id="komoot"
         placeholder="Komoot Link">

  <div>

    <input id="gpxFile"
           type="file"
           accept=".gpx">

    <div id="currentGpx"></div>

  </div>

</div>

<div id="recurringFields"
     class="hidden">

<div class="row">

  <select id="daysOfWeek">

    <option value="">
      Wochentag
    </option>

    <option value="1">
      Montag
    </option>

    <option value="2">
      Dienstag
    </option>

    <option value="3">
      Mittwoch
    </option>

    <option value="4">
      Donnerstag
    </option>

    <option value="5">
      Freitag
    </option>

    <option value="6">
      Samstag
    </option>

    <option value="0">
      Sonntag
    </option>

  </select>

  <input id="startTime"
         type="time">

</div>

<div class="row">

  <input id="startRecur"
         type="date">

  <input id="endRecur"
         type="date">

</div>

<textarea id="exclude"
          placeholder='["2026-05-26"]'></textarea>

</div>

<textarea id="content"
          placeholder="Inhalt"></textarea>

<button onclick="saveEvent()">
  Speichern
</button>

<script>

const supabaseUrl =
  'https://eazizesytrnknbgrnggj.supabase.co';

const supabaseKey =
  'sb_publishable_Bz-kKI-XUf9Y1sM3hWIfAw_4l8fIPQr';

const supabaseClient =
  window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

const params =
  new URLSearchParams(window.location.search);

const editId =
  params.get('id');

function toggleRecurring() {

  const recurring =
    document.getElementById('recurring')
      .checked;

  const recurringFields =
    document.getElementById('recurringFields');

  const singleFields =
    document.getElementById('singleFields');

  if (recurring) {

    recurringFields
      .classList.remove('hidden');

    singleFields
      .classList.add('hidden');

  } else {

    recurringFields
      .classList.add('hidden');

    singleFields
      .classList.remove('hidden');

  }

}

async function loadEvent() {

  if (!editId) {
    return;
  }

  document.getElementById('form-title')
    .innerText =
      'Termin bearbeiten';

  const { data, error } =
    await supabaseClient
      .from('Termine')
      .select('*')
      .eq('id', editId)
      .single();

  if (error) {
    console.error(error);
    return;
  }

  document.getElementById('title').value =
    data.title || '';

  document.getElementById('date').value =
    data.date
      ? data.date.substring(0,16)
      : '';

  document.getElementById('location').value =
    data.location || '';

  document.getElementById('category').value =
    data.category || '';

  document.getElementById('komoot').value =
    data.komoot || '';

document.getElementById('content').value =
  data.content || '';

if (data.image) {

  document.getElementById('currentImage')
    .innerHTML = `

      <p>Aktuelles Bild:</p>

      <img src="${data.image}"
           class="preview-image">

    `;

}

if (data.gpx) {

  document.getElementById('currentGpx')
    .innerHTML = `

      <p>Aktuelle GPX:</p>

<a href="${data.gpx}"
   target="_blank">

  ${
    data.gpx
      .split('/')
      .pop()
      .replace(/^[0-9]+-/, '')
  }

</a>


    `;

}

  document.getElementById('recurring').checked =
  data.recurring || false;

document.getElementById('startTime').value =
  data.startTime || '';

document.getElementById('startRecur').value =
  data.startRecur || '';

document.getElementById('endRecur').value =
  data.endRecur || '';

document.getElementById('daysOfWeek').value =
  data.daysOfWeek
    ? data.daysOfWeek[0]
    : '';

document.getElementById('exclude').value =
  data.exclude
    ? JSON.stringify(data.exclude)
    : '';

toggleRecurring();

}

async function saveEvent() {

  const title =
    document.getElementById('title').value;

  const date =
    document.getElementById('date').value;

  const location =
    document.getElementById('location').value;

  const category =
    document.getElementById('category').value;

  const komoot =
    document.getElementById('komoot').value;

  const content =
    document.getElementById('content').value;

  const recurring =
    document.getElementById('recurring').checked;

  const startTime =
    document.getElementById('startTime').value;

  const startRecur =
    document.getElementById('startRecur').value;

  const endRecur =
    document.getElementById('endRecur').value;

  const daysOfWeek =
    document.getElementById('daysOfWeek').value;

  const exclude =
    document.getElementById('exclude').value;

  const imageFile =
    document.getElementById('imageFile')
      .files[0];

  const gpxFile =
    document.getElementById('gpxFile')
      .files[0];

  const slug =
    title
      .toLowerCase()
      .replaceAll(' ', '-');

  let parsedExclude = [];

  try {

    parsedExclude =
      exclude && exclude.trim() !== ''
        ? JSON.parse(exclude)
        : [];

  } catch {

    alert('Exclude JSON ungültig');

    return;

  }

  let image = null;
  let gpx = null;

  if (editId) {

  const { data } =
    await supabaseClient
      .from('Termine')
      .select('image,gpx')
      .eq('id', editId)
      .single();

  image = data?.image || null;
  gpx = data?.gpx || null;

}

  if (imageFile) {

    const imageName =
      Date.now() + '-' + imageFile.name;

    const { error } =
      await supabaseClient.storage
        .from('media')
        .upload(imageName, imageFile);

    if (!error) {

      image =
        supabaseUrl +
        '/storage/v1/object/public/MEDIA/' +
        imageName;

    }

  }

  if (gpxFile) {

    const gpxName =
      Date.now() + '-' + gpxFile.name;

    const { error } =
      await supabaseClient.storage
        .from('media')
        .upload(gpxName, gpxFile);

    if (!error) {

      gpx =
        supabaseUrl +
        '/storage/v1/object/public/media/' +
        gpxName;

    }

  }

  const payload = {

    title,

    date:
      recurring
        ? null
        : date || null,

    location,

    category,

    komoot,

    content,

    recurring,

    startTime:
      recurring
        ? startTime
        : null,

    startRecur:
      recurring
        ? startRecur || null
        : null,

    endRecur:
      recurring
        ? endRecur || null
        : null,

    daysOfWeek:
      recurring && daysOfWeek
        ? [parseInt(daysOfWeek)]
        : null,

    exclude: parsedExclude,

    slug

  };

  if (image) {
    payload.image = image;
  }

  if (gpx) {
    payload.gpx = gpx;
  }

  let error;

  if (editId) {

    ({ error } =
      await supabaseClient
        .from('Termine')
        .update(payload)
        .eq('id', editId));

  } else {

    ({ error } =
      await supabaseClient
        .from('Termine')
        .insert([payload]));

  }

  if (error) {

    console.error(error);

    alert(error.message);

    return;

  }

  window.location.href =
    '/admin/termine.html';

}

toggleRecurring();
loadEvent();

</script>

</body>

</html>
