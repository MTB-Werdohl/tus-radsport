---
layout: default
---

<div class="event-page">

<div class="event-meta">

  <h1>
    📅 {{ page.date | date: "%d.%m.%Y" }}
  </h1>

  <p class="event-time">
    🕒 {{ page.date | date: "%H:%M" }} Uhr
  </p>

  {% if page.location %}
  <p>
    📍 {{ page.location }}
  </p>
  {% endif %}

</div>

  {% if page.image %}
  <img class="event-image" src="{{ page.image }}">
  {% endif %}

  <div class="event-content">
    {{ content }}
  </div>

</div>
