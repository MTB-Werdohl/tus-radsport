<!doctype html>

<html lang="de">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    News verwalten
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet"
        href="/assets/css/admin.css">

</head>

<body>

<div id="admin">

  <div class="page-header">

    <div>

      <h1>
        News
      </h1>

      <p>
        Newsbeiträge verwalten
      </p>

    </div>

    <div class="page-actions">

      <a href="/admin/"
         class="back-button">

        ← Dashboard

      </a>

      <a href="/admin/news_edit.html"
         class="primary-button">

        + Neue News

      </a>

    </div>

  </div>

  <div id="news-list"
       class="admin-list"></div>

</div>

<script>

const supabaseUrl =
  'https://eazizesytrnknbgrnggj.supabase.co';

const supabaseKey =
  'DEIN_SUPABASE_ANON_KEY';

const supabaseClient =
  window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

async function loadNews() {

  const { data, error } =
    await supabaseClient
      .from('News')
      .select('*')
      .order(
        'created_at',
        { ascending: false }
      );

  if (error) {

    console.error(error);

    return;

  }

  renderNews(data);

}

function renderNews(news) {

  const container =
    document.getElementById('news-list');

  container.innerHTML = '';

  if (!news.length) {

    container.innerHTML = `
      <p>
        Noch keine News vorhanden.
      </p>
    `;

    return;

  }

  news.forEach(item => {

    const article =
      document.createElement('article');

    article.className =
      'admin-item';

    article.innerHTML = `

      <div class="admin-item-content">

        <h2>
          ${item.title}
        </h2>

        <p>
          /news/${item.slug}
        </p>

        <small>
          ${
            item.published
              ? '✅ Veröffentlicht'
              : '📝 Entwurf'
          }
        </small>

      </div>

      <div class="admin-actions">

        <a
          href="/admin/news_edit.html?id=${item.id}"
          class="edit-button">

          Bearbeiten

        </a>

        <button
          class="delete-button"
          onclick="deleteNews('${item.id}')">

          Löschen

        </button>

      </div>

    `;

    container.appendChild(article);

  });

}

async function deleteNews(id) {

  const confirmed =
    confirm(
      'News wirklich löschen?'
    );

  if (!confirmed) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('News')
      .delete()
      .eq('id', id);

  if (error) {

    console.error(error);

    return;

  }

  loadNews();

}

loadNews();

</script>

</body>

</html>
