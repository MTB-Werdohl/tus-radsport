<div id="event"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl = 'https://eazizesytrnknbgrnggj.supabase.co';

const supabaseKey = 'sb_publishable_Bz-kKI-XUf9Y1sM3hWIfAw_4l8fIPQr';

const supabaseClient = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const params = new URLSearchParams(window.location.search);

const slug = params.get('slug');

async function loadEvent() {

  const { data, error } = await supabaseClient
    .from('Termine')
    .select('*')
    .eq('slug', slug)
    .single();

  if (error) {
    console.error(error);
    return;
  }

  const eventDate = new Date(data.date);

  const formattedDate = eventDate.toLocaleDateString('de-DE', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  });

  const formattedTime = eventDate.toLocaleTimeString('de-DE', {
    hour: '2-digit',
    minute: '2-digit'
  });

  document.title = `${data.title} · MTB Werdohl`;

  document.getElementById('event').innerHTML = `

    <div class="event-page">

<div class="event-meta">

  <h1 class="event-title">
    ${data.title}
  </h1>

  <h2 class="event-date">
    📅 ${formattedDate}
  </h2>

        <p class="event-time">
          🕒 ${formattedTime} Uhr
        </p>

        ${data.location
          ? `
            <p>
              📍 ${data.location}
            </p>
          `
          : ''
        }

      </div>

      ${data.image
        ? `
          <img class="event-image"
               src="${data.image}">
        `
        : ''
      }

      ${(data.komoot || data.gpx)
        ? `
          <div class="event-links">

            ${data.komoot
              ? `
                <a href="${data.komoot}"
                   target="_blank"
                   class="event-button">
                   🚵 Komoot
                </a>
              `
              : ''
            }

            ${data.gpx
              ? `
                <a href="${data.gpx}"
                   target="_blank"
                   class="event-button">
                   ⬇ GPX Download
                </a>
              `
              : ''
            }

          </div>
        `
        : ''
      }

      <div class="event-content">
        ${data.content || ''}
      </div>

    </div>

  `;

}

loadEvent();

</script>
