---
layout: null
title: News bearbeiten
---

<!doctype html>

<html lang="de">

<head>

{% include admin-head.html %}

</head>

<body>

<div id="admin">

  <div class="page-header">

    <div>

      <h1 id="form-title">
        Neue News
      </h1>

      <p>
        Newsbeitrag anlegen oder bearbeiten
      </p>

    </div>

    <a href="/admin/news.html"
       class="back-button">

      ← News

    </a>

  </div>

  <div class="member-admin-form">

    <label>
      Titel
      <input id="title" type="text">
    </label>

    <label>
      Slug
      <input id="slug" type="text">
    </label>

    <label>
      Kurztext
      <textarea id="excerpt" rows="3"></textarea>
    </label>

    <label>
      Inhalt
      <textarea id="content" rows="8"></textarea>
    </label>

    <label>
      Bild
      <input id="imageFile" type="file" accept="image/*">
    </label>

    <div id="currentImage"></div>

    <label>
      Sichtbarkeit
      <select id="sichtbarkeit">
        <option value="draft">Entwurf (nur Vorstand)</option>
        <option value="public">Öffentlich</option>
        <option value="members">Nur Mitglieder</option>
      </select>
    </label>

    <button id="save-news" type="button">
      Speichern
    </button>

    <section class="admin-feedback-section">

      <h2>Feedback (optional)</h2>

      <p
        id="feedback-admin-hint"
        class="admin-hint">

        Nach dem ersten Speichern können Sie hier Feedback hinzufügen.

      </p>

      <div id="feedback-admin-form-wrap"></div>

    </section>

  </div>

</div>

<script src="/assets/js/feedback/feedback-types.js"></script>
<script src="/assets/js/feedback/feedback-service.js"></script>
<script src="/admin/js/feedback-module-form.js"></script>
<script src="/admin/js/news-edit.js"></script>
<script>
requireAdminSession(initNewsEdit);
</script>

</body>

</html>
