<!doctype html>

<html lang="de">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    Push-Mitteilungen
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="/assets/js/push/config.js"></script>

  <link rel="stylesheet"
        href="/assets/css/admin.css">

</head>

<body>

<div id="admin">

  <div class="page-header">

    <div>

      <h1>
        Push-Mitteilungen
      </h1>

      <p>
        Nachrichten an alle Geräte senden
      </p>

    </div>

    <a href="/admin/"
       class="back-button">

      ← Dashboard

    </a>

  </div>

  <div class="admin-push">

    <form id="push-form">

      <label for="push-title">
        Titel
      </label>

      <input
        type="text"
        id="push-title"
        required
      >

      <label for="push-body">
        Nachricht
      </label>

      <textarea
        id="push-body"
        rows="5"
        required
      ></textarea>

      <label for="push-url">
        Link (optional)
      </label>

      <input
        type="text"
        id="push-url"
        placeholder="/news"
      >

      <button type="submit">
        Push senden
      </button>

    </form>

    <div id="push-status"></div>

  </div>

</div>

<script>

document
  .getElementById('push-form')
  .addEventListener('submit', async (event) => {

    event.preventDefault();

    const title =
      document.getElementById('push-title').value;

    const body =
      document.getElementById('push-body').value;

    const url =
      document.getElementById('push-url').value || '/';

    const status =
      document.getElementById('push-status');

    status.innerText =
      'Push wird gesendet...';

    try {

      const response = await fetch(
        'https://eazizesytrnknbgrnggj.supabase.co/functions/v1/send-push',
        {

          method: 'POST',

          headers: {

            'Content-Type': 'application/json',

            'Authorization':
              `Bearer ${window.pushConfig.supabaseKey}`

          },

          body: JSON.stringify({

            title,
            body,
            url

          })

        }
      );

      const result =
        await response.json();

      console.log(result);

      status.innerText =
        '✅ Push erfolgreich gesendet';

      document
        .getElementById('push-form')
        .reset();

    } catch(error) {

      console.error(error);

      status.innerText =
        '❌ Fehler beim Senden';

    }

  });

</script>

</body>

</html>
