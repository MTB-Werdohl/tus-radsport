---
layout: default
---

<div class="event-page">

  <div class="event-meta">
    <h1>
    <p>
      📅
      {{ page.date | date: "%d.%m.%Y" }}
      {% if page.time %}
        • {{ page.time }}
      {% endif %}
    </p>
    </h1>

    {% if page.location %}
    <p>
      📍 {{ page.location }}
    </p>
    {% endif %}

  </div>

  {% if page.image %}
  <img class="event-image" src="{{ page.image }}">
  {% endif %}

  <div class="event-content">
    {{ content }}
  </div>

</div>
