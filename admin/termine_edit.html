---
layout: null
title: Termin bearbeiten
---

<!doctype html>

<html lang="de">

<head>

{% include admin-head.html %}

</head>

<body>

{% include admin-escape-nav.html %}

<h1 id="form-title">
  Neuer Termin
</h1>

<input id="title"
       placeholder="Titel">

<label>

  <input id="recurring"
         type="checkbox"
         class="checkbox">

  Wiederkehrender Termin

</label>

<div id="singleFields">

  <div class="row">

    <input id="date"
           type="datetime-local">

    <input id="location"
           placeholder="Ort">

  </div>

</div>

<div class="row">

  <input id="category"
         placeholder="Kategorie">

  <div>

    <input id="imageFile"
           type="file"
           accept="image/*">

    <div id="currentImage"></div>

  </div>

</div>

<div class="row">

  <input id="komoot"
         placeholder="Komoot Link">

  <div>

    <input id="gpxFile"
           type="file"
           accept=".gpx">

    <div id="currentGpx"></div>

  </div>

</div>

<div id="recurringFields"
     class="hidden">

<div class="row">

  <select id="daysOfWeek">

    <option value="">
      Wochentag
    </option>

    <option value="1">
      Montag
    </option>

    <option value="2">
      Dienstag
    </option>

    <option value="3">
      Mittwoch
    </option>

    <option value="4">
      Donnerstag
    </option>

    <option value="5">
      Freitag
    </option>

    <option value="6">
      Samstag
    </option>

    <option value="0">
      Sonntag
    </option>

  </select>

  <input id="startTime"
         type="time">

</div>

<div class="row">

  <input id="startRecur"
         type="date">

  <input id="endRecur"
         type="date">

</div>

<textarea id="exclude"
          placeholder='["2026-05-26"]'></textarea>

</div>

<textarea id="content"
          placeholder="Inhalt"></textarea>

<label>

  Sichtbarkeit

  <select id="sichtbarkeit">

    <option value="public">
      Öffentlich
    </option>

    <option value="members">
      Nur Mitglieder
    </option>

    <option value="draft">
      Entwurf (nur Vorstand)
    </option>

  </select>

</label>

<button id="save-event" type="button">
  Speichern
</button>

<script src="/admin/js/auth-guard.js"></script>
<script src="/admin/js/termine-edit.js"></script>
<script>
requireAdminSession(initTerminEdit);
</script>

</body>

</html>
