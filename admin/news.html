<!doctype html>

<html lang="de">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    News Verwaltung
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="/assets/js/push/config.js"></script>
  <script src="/assets/js/core/supabase.js"></script>

  <link rel="stylesheet"
        href="/assets/css/admin.css">

</head>

<body>

<div id="admin">

  <div class="page-header">

    <div>

      <h1>
        News anlegen und bearbeiten
      </h1>

      <p>
        Newsbeiträge verwalten
      </p>

    </div>

    <a href="/admin/"
       class="back-button">

      ← Dashboard

    </a>

  </div>

  <div class="admin-topbar">

    <input
      id="search"
      placeholder="News suchen..."
      oninput="loadNews()"
    >

    <button
      class="new-button"
      onclick="newNews()">

      ➕ Neue News

    </button>

  </div>

  <div id="news"></div>

</div>

<script>

async function loadNews() {

  const { data, error } =
    await supabaseClient
      .from('News')
      .select('*')
      .order(
        'created_at',
        { ascending: false }
      );

  if (error) {

    console.error(error);

    return;

  }

  const search =
    document
      .getElementById('search')
      .value
      .toLowerCase();

  const container =
    document.getElementById('news');

  container.innerHTML = '';

  data

    .filter(item => {

      return (

        item.title
          ?.toLowerCase()
          .includes(search)

        ||

        item.excerpt
          ?.toLowerCase()
          .includes(search)

      );

    })

    .forEach(item => {

      container.innerHTML += `

        <div class="event-card">

          <div class="event-header">

            <div>

              <strong>
                ${item.title}
              </strong>

              <div class="event-meta">

                ${
                  item.published
                    ? '✅ Veröffentlicht'
                    : '📝 Entwurf'
                }

                ·

                /news/${item.slug}

              </div>

            </div>

            <div class="actions">

              <button
                onclick="openNews('${item.id}')">

                ✏

              </button>

              <button
                class="delete-button"
                onclick="deleteNews('${item.id}')">

                🗑

              </button>

            </div>

          </div>

        </div>

      `;

    });

}

async function deleteNews(id) {

  const confirmDelete =
    confirm(
      'News löschen?'
    );

  if (!confirmDelete) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('News')
      .delete()
      .eq('id', id);

  if (error) {

    console.error(error);

    return;

  }

  loadNews();

}

function newNews() {

  window.location.href =
    '/admin/news_edit.html';

}

function openNews(id) {

  window.location.href =
    '/admin/news_edit.html?id=' + id;

}

async function checkSession() {

  const { data } =
    await supabaseClient.auth
      .getSession();

  if (!data.session) {

    window.location.href =
      '/admin/';

    return;

  }

  loadNews();

}

checkSession();

</script>

</body>

</html>
