---
layout: null
title: News bearbeiten
---

<!doctype html>

<html lang="de">

<head>

{% include admin-head.html %}

</head>

<body>

<div id="admin">

  <div class="page-header">

    <div>

      <h1 id="form-title">
        Neue News
      </h1>

      <p>
        Newsbeitrag anlegen oder bearbeiten
      </p>

    </div>

    <a href="/admin/news.html"
       class="back-button">

      ← News

    </a>

  </div>

  <div class="member-admin-form">

<label class="admin-field">
  Titel
  <input id="title"
         type="text"
         placeholder="Titel">
</label>

<section class="admin-feedback-section">

  <h2>Feedback (optional)</h2>

  <div id="feedback-admin-form-wrap"></div>

</section>

<label class="admin-field">
  Kurztext
  <textarea id="excerpt"
            rows="3"
            placeholder="Kurztext"></textarea>
</label>

<label class="admin-field">
  Inhalt
  <textarea id="content"
            rows="8"
            placeholder="Inhalt"></textarea>
</label>

<label class="admin-field">
  Bild
  <input id="imageFile"
         type="file"
         accept="image/*">
  <div id="currentImage"></div>
</label>

<label class="admin-field">
  Sichtbarkeit
  <select id="sichtbarkeit">

    <option value="draft">
      Entwurf (nur Vorstand)
    </option>

    <option value="public">
      Öffentlich
    </option>

    <option value="members">
      Nur Mitglieder
    </option>

  </select>
</label>

<button id="save-news"
        type="button"
        class="admin-form-save">

  Speichern

</button>

  </div>

</div>

<script src="/assets/js/feedback/feedback-types.js?v={{ site.admin_js_version }}"></script>
<script src="/assets/js/feedback/feedback-service.js?v={{ site.admin_js_version }}"></script>
<script src="/admin/js/feedback-module-form.js?v={{ site.admin_js_version }}"></script>
<script src="/admin/js/news-edit.js?v={{ site.admin_js_version }}"></script>
<script>
requireAdminSession(initNewsEdit);
</script>

</body>

</html>
