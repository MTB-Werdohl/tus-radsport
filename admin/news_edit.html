<!doctype html>

<html lang="de">

<head>

{% include admin-head.html %}

</head>

<body>

<h1 id="form-title">
  Neue News
</h1>

<input id="title"
       placeholder="Titel">

<input id="slug"
       placeholder="Slug">

<textarea id="excerpt"
          placeholder="Kurztext"></textarea>

<textarea id="content"
          placeholder="Inhalt"></textarea>

<div>

  <input id="imageFile"
         type="file"
         accept="image/*">

  <div id="currentImage"></div>

</div>

<label>

  <input id="published"
         type="checkbox"
         class="checkbox">

  Veröffentlicht

</label>

<button onclick="saveNews()">
  Speichern
</button>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const editId =
  params.get('id');

async function loadNews() {

  if (!editId) {
    return;
  }

  document
    .getElementById('form-title')
    .innerText =
      'News bearbeiten';

  const { data, error } =
    await supabaseClient
      .from('News')
      .select('*')
      .eq('id', editId)
      .single();

  if (error) {

    console.error(error);

    return;

  }

  document.getElementById('title').value =
    data.title || '';

  document.getElementById('slug').value =
    data.slug || '';

  document.getElementById('excerpt').value =
    data.excerpt || '';

  document.getElementById('content').value =
    data.content || '';

  document.getElementById('published').checked =
    data.published || false;

  if (data.image) {

    document
      .getElementById('currentImage')
      .innerHTML = `

        <p>Aktuelles Bild:</p>

        <img src="${data.image}"
             class="preview-image">

      `;

  }

}

async function saveNews() {

  const title =
    document
      .getElementById('title')
      .value;

  const slugInput =
    document
      .getElementById('slug')
      .value;

  const excerpt =
    document
      .getElementById('excerpt')
      .value;

  const content =
    document
      .getElementById('content')
      .value;

  const published =
    document
      .getElementById('published')
      .checked;

  const imageFile =
    document
      .getElementById('imageFile')
      .files[0];

  const slug =
    slugInput && slugInput !== ''
      ? slugInput
      : title
          .toLowerCase()
          .replaceAll(' ', '-')
          .replace(/[^\w-]+/g, '');

  let image = null;

  if (editId) {

    const { data } =
      await supabaseClient
        .from('News')
        .select('image')
        .eq('id', editId)
        .single();

    image =
      data?.image || null;

  }

  if (imageFile) {

    const imageName =
      Date.now() +
      '-' +
      imageFile.name;

    const { error } =
      await supabaseClient
        .storage
        .from('media')
        .upload(
          imageName,
          imageFile
        );

    if (!error) {

const {
  data: imageData
} =
  supabaseClient
    .storage
    .from('media')
    .getPublicUrl(imageName);

image =
  imageData.publicUrl;

    }

  }

  const payload = {

    title,
    slug,
    excerpt,
    content,
    published,
    updated_at:
      new Date().toISOString()

  };

  if (image) {
    payload.image = image;
  }

  let error;

  if (editId) {

    ({ error } =
      await supabaseClient
        .from('News')
        .update(payload)
        .eq('id', editId));

  } else {

    ({ error } =
      await supabaseClient
        .from('News')
        .insert([payload]));

  }

  if (error) {

    console.error(error);

    alert(error.message);

    return;

  }

  window.location.href =
    '/admin/news.html';

}

</script>

<script src="/admin/js/auth-guard.js"></script>

<script>

requireAdminSession(loadNews);

</script>

</body>

</html>
