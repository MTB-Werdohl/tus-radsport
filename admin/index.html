<!doctype html>

<html lang="de">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>MTB Werdohl Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>

    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 180px;
    }

    button {
      background: #2e8b57;
      color: white;
      cursor: pointer;
    }

    h1,
    h2,
    h3 {
      color: white;
    }

    .event-card {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    .checkbox {
      width: auto;
      margin-right: 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .delete-button {
      background: #c0392b;
    }

  </style>

</head>

<body>

<div id="login">

  <h1>Admin Login</h1>

  <input id="email"
         placeholder="E-Mail">

  <input id="password"
         type="password"
         placeholder="Passwort">

  <button onclick="login()">
    Login
  </button>

</div>

<div id="admin"
     class="hidden">

  <h1>Adminbereich</h1>

  <div id="events"></div>

  <h2 id="form-title">
    Neuer Termin
  </h2>

  <input id="title"
         placeholder="Titel">

  <div class="row">

    <input id="date"
           type="datetime-local">

    <input id="location"
           placeholder="Ort">

  </div>

  <div class="row">

    <input id="category"
           placeholder="Kategorie">

    <input id="image"
           placeholder="Bild URL">

  </div>

  <div class="row">

    <input id="komoot"
           placeholder="Komoot Link">

    <input id="gpx"
           placeholder="GPX Datei URL">

  </div>

  <label>
    <input id="recurring"
           type="checkbox"
           class="checkbox">
    Wiederkehrender Termin
  </label>

  <div class="row">

    <select id="daysOfWeek">

      <option value="">
        Wochentag
      </option>

      <option value="1">
        Montag
      </option>

      <option value="2">
        Dienstag
      </option>

      <option value="3">
        Mittwoch
      </option>

      <option value="4">
        Donnerstag
      </option>

      <option value="5">
        Freitag
      </option>

      <option value="6">
        Samstag
      </option>

      <option value="0">
        Sonntag
      </option>

    </select>

    <input id="startTime"
           type="time">

  </div>

  <div class="row">

    <input id="startRecur"
           type="date">

    <input id="endRecur"
           type="date">

  </div>

  <textarea id="exclude"
            placeholder='Ausnahmen JSON z.B. ["2026-05-26"]'></textarea>

  <textarea id="description"
            placeholder="Kurzbeschreibung"></textarea>

  <textarea id="content"
            placeholder="Markdown Inhalt"></textarea>

  <button onclick="saveEvent()">
    Termin speichern
  </button>

</div>

<script>

const supabaseUrl =
  'https://eazizesytrnknbgrnggj.supabase.co';

const supabaseKey =
  'sb_publishable_Bz-kKI-XUf9Y1sM3hWIfAw_4l8fIPQr';

const supabaseClient =
  window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

let currentEditId = null;

async function login() {

  const email =
    document.getElementById('email').value;

  const password =
    document.getElementById('password').value;

  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email,
      password

    });

  if (error) {

    alert(error.message);

    return;

  }

  document.getElementById('login')
    .classList.add('hidden');

  document.getElementById('admin')
    .classList.remove('hidden');

  loadEvents();

}

async function loadEvents() {

  const { data, error } =
    await supabaseClient
      .from('Termine')
      .select('*')
      .order('id', {
        ascending: false
      });

  if (error) {
    console.error(error);
    return;
  }

  const container =
    document.getElementById('events');

  container.innerHTML = '';

  data.forEach(event => {

    container.innerHTML += `

      <div class="event-card">

        <h3>${event.title}</h3>

        <p>
          ${event.location || ''}
        </p>

        <p>
          ${event.date || ''}
        </p>

        <div class="actions">

          <button onclick="editEvent(${event.id})">
            Bearbeiten
          </button>

          <button class="delete-button"
                  onclick="deleteEvent(${event.id})">
            Löschen
          </button>

        </div>

      </div>

    `;

  });

}

async function editEvent(id) {

  const { data, error } =
    await supabaseClient
      .from('Termine')
      .select('*')
      .eq('id', id)
      .single();

  if (error) {
    console.error(error);
    return;
  }

  currentEditId = id;

  document.getElementById('form-title')
    .innerText = 'Termin bearbeiten';

  document.getElementById('title').value =
    data.title || '';

  document.getElementById('date').value =
    data.date
      ? data.date.substring(0, 16)
      : '';

  document.getElementById('location').value =
    data.location || '';

  document.getElementById('category').value =
    data.category || '';

  document.getElementById('image').value =
    data.image || '';

  document.getElementById('komoot').value =
    data.komoot || '';

  document.getElementById('gpx').value =
    data.gpx || '';

  document.getElementById('description').value =
    data.description || '';

  document.getElementById('content').value =
    data.content || '';

  document.getElementById('recurring').checked =
    data.recurring || false;

  document.getElementById('startTime').value =
    data.startTime || '';

  document.getElementById('startRecur').value =
    data.startRecur || '';

  document.getElementById('endRecur').value =
    data.endRecur || '';

  document.getElementById('daysOfWeek').value =
    data.daysOfWeek
      ? data.daysOfWeek[0]
      : '';

  document.getElementById('exclude').value =
    data.exclude
      ? JSON.stringify(data.exclude)
      : '';

}

async function saveEvent() {

  const title =
    document.getElementById('title').value;

  const date =
    document.getElementById('date').value;

  const location =
    document.getElementById('location').value;

  const category =
    document.getElementById('category').value;

  const image =
    document.getElementById('image').value;

  const komoot =
    document.getElementById('komoot').value;

  const gpx =
    document.getElementById('gpx').value;

  const description =
    document.getElementById('description').value;

  const content =
    document.getElementById('content').value;

  const recurring =
    document.getElementById('recurring').checked;

  const startTime =
    document.getElementById('startTime').value;

  const startRecur =
    document.getElementById('startRecur').value;

  const endRecur =
    document.getElementById('endRecur').value;

  const daysOfWeek =
    document.getElementById('daysOfWeek').value;

  const exclude =
    document.getElementById('exclude').value;

  const slug =
    title
      .toLowerCase()
      .replaceAll(' ', '-');

const payload = {

  title,

  date:
    recurring || !date
      ? null
      : date,

  location,

  category,

  image,

  komoot,

  gpx,

  description,

  content,

  recurring,

  startTime,

  startRecur:
    startRecur || null,

  endRecur:
    endRecur || null,

  slug,

  daysOfWeek:
    recurring && daysOfWeek
      ? [parseInt(daysOfWeek)]
      : null,

  exclude: parsedExclude

};

  let error;

  if (currentEditId) {

    ({ error } =
      await supabaseClient
        .from('Termine')
        .update(payload)
        .eq('id', currentEditId));

  } else {

    ({ error } =
      await supabaseClient
        .from('Termine')
        .insert([payload]));

  }

  if (error) {
    console.error(error);
    alert(error.message);
    return;
  }

  alert('Termin gespeichert');

  resetForm();

  loadEvents();

}

function resetForm() {

  currentEditId = null;

  document.getElementById('form-title')
    .innerText = 'Neuer Termin';

  [
    'title',
    'date',
    'location',
    'category',
    'image',
    'komoot',
    'gpx',
    'description',
    'content',
    'startTime',
    'startRecur',
    'endRecur',
    'daysOfWeek',
    'exclude'
  ].forEach(id => {

    document.getElementById(id).value = '';

  });

  document.getElementById('recurring')
    .checked = false;

}

async function deleteEvent(id) {

  const confirmDelete =
    confirm('Termin löschen?');

  if (!confirmDelete) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('Termine')
      .delete()
      .eq('id', id);

  if (error) {
    console.error(error);
    return;
  }

  loadEvents();

}

async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    document.getElementById('login')
      .classList.add('hidden');

    document.getElementById('admin')
      .classList.remove('hidden');

    loadEvents();

  }

}

checkSession();

</script>

</body>

</html>
