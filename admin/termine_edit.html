---
layout: null
title: Termin bearbeiten
---

<!doctype html>

<html lang="de">

<head>

{% include admin-head.html %}

</head>

<body>

<div id="admin">

  <div class="page-header">

    <div>

      <h1 id="form-title">
        Neuer Termin
      </h1>

      <p>
        Termin anlegen oder bearbeiten
      </p>

    </div>

    <a href="/admin/termine.html"
       class="back-button">

      ← Termine

    </a>

  </div>

  <div class="member-admin-form">

<label class="admin-field">
  Titel
  <input id="title"
         placeholder="Titel">
</label>

<div id="singleFields">

  <div class="row">

    <label class="admin-field">
      Start
      <input id="date"
             type="date">
    </label>

    <label class="admin-field">
      Ende (optional)
      <input id="endDate"
             type="date">
    </label>

  </div>

  <p class="admin-hint">
    Enddatum leer lassen für eintägige Termine.
    Für Mehrtages-Termine z.&nbsp;B. 23.05.–28.05. Enddatum setzen.
  </p>

</div>

<div class="row">

  <label class="admin-field">
    Uhrzeit
    <input id="startTime"
           type="time">
  </label>

  <label class="admin-field">
    Ort
    <input id="location"
           placeholder="Ort">
  </label>

</div>

<div class="row">

  <label class="admin-field">
    Kategorie
    <select id="category">
      <option value="">
        Kategorie wählen…
      </option>
    </select>
  </label>

  <label class="admin-field">
    Bild
    <input id="imageFile"
           type="file"
           accept="image/*">
    <input id="imageStoragePathPick"
           type="hidden">
    <div class="admin-media-field-actions">
      <button id="pick-image-btn"
              type="button"
              class="secondary-button">
        Aus Mediathek
      </button>
    </div>
    <div id="currentImage"></div>
  </label>

</div>

<div class="row">

  <label class="admin-field">
    Komoot Link
    <input id="komoot"
           placeholder="Komoot Link">
  </label>

  <label class="admin-field">
    GPX
    <input id="gpxFile"
           type="file"
           accept=".gpx">
    <input id="gpxStoragePathPick"
           type="hidden">
    <div class="admin-media-field-actions">
      <button id="pick-gpx-btn"
              type="button"
              class="secondary-button">
        Aus Mediathek
      </button>
    </div>
    <div id="currentGpx"></div>
  </label>

</div>

<label class="admin-field">
  Inhalt
  <textarea id="content"
            placeholder="Inhalt"></textarea>
</label>

<label class="admin-field">
  Sichtbarkeit
  <select id="sichtbarkeit">

    <option value="draft">
      Entwurf (nur Vorstand)
    </option>

    <option value="public">
      Öffentlich
    </option>

    <option value="members">
      Nur Mitglieder
    </option>

  </select>
</label>

<button id="save-event"
        type="button"
        class="admin-form-save">

  Speichern

</button>

  </div>

</div>

<script src="/assets/js/calendar/categories.js?v={{ site.admin_js_version }}"></script>
<script src="/assets/js/core/termin-dates.js?v={{ site.admin_js_version }}"></script>
<script src="/assets/js/feedback/feedback-types.js?v={{ site.admin_js_version }}"></script>
<script src="/assets/js/feedback/feedback-service.js?v={{ site.admin_js_version }}"></script>
<script src="/admin/js/media-storage-lib.js?v={{ site.admin_js_version }}"></script>
<script src="/admin/js/media-picker.js?v={{ site.admin_js_version }}"></script>
<script src="/admin/js/termine-edit.js?v={{ site.admin_js_version }}"></script>
<script>
requireAdminSession(() => {
  initTerminEdit();
});
</script>

</body>

</html>
