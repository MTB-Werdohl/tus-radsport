title: Push-Mitteilungen

<!doctype html>

<html lang="de">

<head>

{% include admin-head.html %}

  <script src="/assets/js/push/state.js"></script>

</head>

<body>

<div id="admin">

  <div class="page-header">

    <div>

      <h1>
        Push-Mitteilungen
      </h1>

      <p>
        Nachrichten an alle Geräte senden
      </p>

    </div>

    <div class="page-header-actions">

      {% include admin-escape-nav.html %}

      <a href="/admin/"
         class="back-button">

        ← Dashboard

      </a>

    </div>

  </div>

  <div class="admin-push">

    <form id="push-form">

      <label for="push-title">
        Titel
      </label>

      <input
        type="text"
        id="push-title"
        required
      >

      <label for="push-body">
        Nachricht
      </label>

      <textarea
        id="push-body"
        rows="5"
        required
      ></textarea>

      <label for="push-url">
        Link (optional)
      </label>

      <input
        type="text"
        id="push-url"
        placeholder="/news"
      >

      <button type="submit">
        Push senden
      </button>

    </form>

    <div id="push-status"></div>

  </div>

</div>

<script src="/admin/js/auth-guard.js"></script>
<script src="/admin/js/push-admin.js"></script>
<script>
requireAdminSession();
</script>

</body>

</html>
