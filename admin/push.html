layout: default
title: Push senden
permalink: /admin/push/
---

<div class="admin-push">

  <h2>Push-Mitteilung senden</h2>

  <form id="push-form">

    <label for="push-title">
      Titel
    </label>

    <input
      type="text"
      id="push-title"
      required
    >

    <label for="push-body">
      Nachricht
    </label>

    <textarea
      id="push-body"
      rows="5"
      required
    ></textarea>

    <label for="push-url">
      Link (optional)
    </label>

    <input
      type="text"
      id="push-url"
      placeholder="/news"
    >

    <button type="submit">
      Push senden
    </button>

  </form>

  <div id="push-status"></div>

</div>

<script>

document
  .getElementById('push-form')
  .addEventListener('submit', async (event) => {

    event.preventDefault();

    const title =
      document.getElementById('push-title').value;

    const body =
      document.getElementById('push-body').value;

    const url =
      document.getElementById('push-url').value || '/';

    const status =
      document.getElementById('push-status');

    status.innerText =
      'Push wird gesendet...';

    try {

      const response = await fetch(
        'https://eazizesytrnknbgrnggj.supabase.co/functions/v1/send-push',
        {

          method: 'POST',

          headers: {

            'Content-Type': 'application/json',

            'Authorization':
              `Bearer ${window.pushConfig.supabaseKey}`

          },

          body: JSON.stringify({

            title,
            body,
            url

          })

        }
      );

      const result =
        await response.json();

      console.log(result);

      status.innerText =
        '✅ Push erfolgreich gesendet';

      document
        .getElementById('push-form')
        .reset();

    } catch(error) {

      console.error(error);

      status.innerText =
        '❌ Fehler beim Senden';

    }

  });

</script>
