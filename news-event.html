<!doctype html>

<html lang="de">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    News bearbeiten
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <link rel="stylesheet"
        href="/assets/css/admin.css">

</head>

<body>

<div id="admin">

  <h1 id="form-title">
    Neue News
  </h1>

  <div class="admin-form">

    <label>
      Titel
    </label>

    <input id="title">

    <label>
      Kurztext
    </label>

    <textarea id="excerpt"
              rows="3"></textarea>

    <label>
      Inhalt
    </label>

    <textarea id="content"
              rows="12"></textarea>

    <label class="checkbox">

      <input type="checkbox"
             id="published">

      Veröffentlicht

    </label>

    <button onclick="saveNews()">
      Speichern
    </button>

  </div>

</div>

<script>

const supabaseUrl =
  'https://eazizesytrnknbgrnggj.supabase.co';

const supabaseKey =
  'DEIN_SUPABASE_KEY';

const supabaseClient =
  window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

const params =
  new URLSearchParams(window.location.search);

const editId =
  params.get('id');

async function loadNews() {

  if (!editId) {
    return;
  }

  const { data, error } =
    await supabaseClient
      .from('News')
      .select('*')
      .eq('id', editId)
      .single();

  if (error) {

    console.error(error);

    return;

  }

  document.getElementById('form-title')
    .innerText = 'News bearbeiten';

  document.getElementById('title').value =
    data.title || '';

  document.getElementById('excerpt').value =
    data.excerpt || '';

  document.getElementById('content').value =
    data.content || '';

  document.getElementById('published').checked =
    data.published || false;

}

async function saveNews() {

  const title =
    document.getElementById('title').value;

  const excerpt =
    document.getElementById('excerpt').value;

  const content =
    document.getElementById('content').value;

  const published =
    document.getElementById('published').checked;

  const slug =
    title
      .toLowerCase()
      .replaceAll(' ', '-');

  const payload = {

    title,
    excerpt,
    content,
    published,
    slug

  };

  let error;

  if (editId) {

    ({ error } =
      await supabaseClient
        .from('News')
        .update(payload)
        .eq('id', editId));

  } else {

    ({ error } =
      await supabaseClient
        .from('News')
        .insert([payload]));

  }

  if (error) {

    console.error(error);

    alert(error.message);

    return;

  }

  window.location.href =
    '/admin/news.html';

}

loadNews();

</script>

</body>

</html>
