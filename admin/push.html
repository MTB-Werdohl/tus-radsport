title: Push-Mitteilungen
---

<!doctype html>

<html lang="de">

<head>

{% include admin-head.html %}

  <script src="/assets/js/push/state.js"></script>

</head>

<body>

<div id="admin">

  <div class="page-header">

    <div>

      <h1>
        Push-Mitteilungen
      </h1>

      <p>
        Nachrichten an alle Geräte senden
      </p>

    </div>

    <a href="/admin/"
       class="back-button">

      ← Dashboard

    </a>

  </div>

  <div class="admin-push">

    <form id="push-form">

      <label for="push-title">
        Titel
      </label>

      <input
        type="text"
        id="push-title"
        required
      >

      <label for="push-body">
        Nachricht
      </label>

      <textarea
        id="push-body"
        rows="5"
        required
      ></textarea>

      <label for="push-url">
        Link (optional)
      </label>

      <input
        type="text"
        id="push-url"
        placeholder="/news"
      >

      <button type="submit">
        Push senden
      </button>

    </form>

    <div id="push-status"></div>

  </div>

</div>

<script>

document
  .getElementById('push-form')
  .addEventListener('submit', async (event) => {

    event.preventDefault();

    const title =
      document.getElementById('push-title').value;

    const body =
      document.getElementById('push-body').value;

    const url =
      document.getElementById('push-url').value || '/';

    const status =
      document.getElementById('push-status');

    status.innerText =
      'Push wird gesendet...';

    try {

      const response = await fetch(
        `${window.siteConfig.functionsUrl}/send-push`,
        {

          method: 'POST',

          headers: {

            'Content-Type': 'application/json',

            'Authorization':
              `Bearer ${window.siteConfig.supabaseAnonKey}`

          },

          body: JSON.stringify({

            title,
            body,
            url

          })

        }
      );

const result =
  await response.json();

console.log(result);

await saveLastPush(

  title,

  body,

  url

);

status.innerText =
  '✅ Push erfolgreich gesendet';

document
  .getElementById('push-form')
  .reset();

    } catch(error) {

      console.error(error);

      status.innerText =
        '❌ Fehler beim Senden';

    }

  });

</script>

<script src="/admin/js/auth-guard.js"></script>

<script>

requireAdminSession();

</script>

</body>

</html>
