<!doctype html>

<html lang="de">

<head>

{% include admin-head.html %}

</head>

<body>

{% include admin-escape-nav.html %}

<h1 id="form-title">
  Neue News
</h1>

<input id="title"
       placeholder="Titel">

<input id="slug"
       placeholder="Slug">

<textarea id="excerpt"
          placeholder="Kurztext"></textarea>

<textarea id="content"
          placeholder="Inhalt"></textarea>

<div>

  <input id="imageFile"
         type="file"
         accept="image/*">

  <div id="currentImage"></div>

</div>

<label>

  Sichtbarkeit

  <select id="sichtbarkeit">

    <option value="draft">
      Entwurf (nur Vorstand)
    </option>

    <option value="public">
      Öffentlich
    </option>

    <option value="members">
      Nur Mitglieder
    </option>

  </select>

</label>

<button id="save-news" type="button">
  Speichern
</button>

<script src="/admin/js/auth-guard.js"></script>
<script src="/admin/js/news-edit.js"></script>
<script>
requireAdminSession(loadNews);
</script>

</body>

</html>
