title: Galerie bearbeiten
---

<!doctype html>

<html lang="de">

<head>

{% include admin-head.html %}

</head>

<body>

<div id="admin">

  <div class="page-header">

    <div>

      <h1 id="form-title">
        Neue Galerie
      </h1>

      <p>
        Galerie-Daten und Bilder pflegen
      </p>

    </div>

    <a href="/admin/galerie.html"
       class="back-button">

      ← Galerien

    </a>

  </div>

  <form
    id="gallery-form"
    class="member-admin-form"
  >

    <label>
      Titel
      <input type="text" id="title" required>
    </label>

    <label>
      Slug
      <input type="text" id="slug" required>
    </label>

    <label>
      Datum
      <input type="date" id="event_date">
    </label>

    <label>
      Beschreibung
      <textarea id="description" rows="5"></textarea>
    </label>

    <label>
      Bilder hochladen
      <input type="file" id="images" multiple accept="image/*">
    </label>

    <button id="save-gallery" type="submit">
      Speichern
    </button>

  </form>

  <div
    id="gallery-images-section"
    class="gallery-images-section hidden"
  >

    <h2>
      Bilder
    </h2>

    <div id="gallery-images" class="gallery-images"></div>

  </div>

</div>

<script src="/admin/js/auth-guard.js"></script>
<script src="/admin/js/gallery-edit.js"></script>
<script>
requireAdminSession(initGalleryEdit);
</script>

</body>

</html>
