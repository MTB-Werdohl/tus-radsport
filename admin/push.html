<!doctype html>

<html lang="de">

<head>

{% include admin-head.html %}

  <script src="/assets/js/push/state.js?v={{ site.admin_js_version }}"></script>

</head>

<body>

<div id="admin">

  <div class="page-header">

    <div>

      <h1>
        Tröte
      </h1>

      <p>
        Mitteilung auf der Startseite veröffentlichen
      </p>

    </div>

    <a href="/admin/"
       class="back-button">

      ← Dashboard

    </a>

  </div>

  <div class="admin-push">

    <form id="push-form">

      <label for="push-title">
        Titel
      </label>

      <input
        type="text"
        id="push-title"
        required
      >

      <label for="push-body">
        Nachricht
      </label>

      <textarea
        id="push-body"
        rows="5"
        required
      ></textarea>

      <label for="push-url">
        Link (optional)
      </label>

      <input
        type="text"
        id="push-url"
        placeholder="/news"
      >

      <button type="submit">
        In Tröte veröffentlichen
      </button>

    </form>

    <div id="push-status"></div>

  </div>

</div>

<script src="/admin/js/push-admin.js?v={{ site.admin_js_version }}"></script>
<script>
requireAdminSession();
</script>

</body>

</html>
