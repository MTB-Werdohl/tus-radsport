<!doctype html>

<html lang="de">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Termine Verwaltung</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <link rel="stylesheet"
        href="/assets/css/admin.css">

</head>

<body>

<div id="admin">

<div class="page-header"> <div> <h1> Termine anlegen und bearbeiten </h1> <p> Veranstaltungen verwalten </p> </div> <a href="/admin/" class="back-button"> ← Dashboard </a> </div>

  <div class="admin-topbar">

    <input id="search"
           placeholder="Termine suchen..."
           oninput="loadEvents()">

    <button class="new-button"
            onclick="newEvent()">
      ➕ Neuer Termin
    </button>

  </div>

  <div id="events"></div>

</div>

<script>

const supabaseUrl =
  'https://eazizesytrnknbgrnggj.supabase.co';

const supabaseKey =
  'sb_publishable_Bz-kKI-XUf9Y1sM3hWIfAw_4l8fIPQr';

const supabaseClient =
  window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

async function loadEvents() {

  const { data, error } =
    await supabaseClient
      .from('Termine')
      .select('*')
      .order('id', {
        ascending: false
      });

  if (error) {

    console.error(error);

    return;

  }

  const search =
    document.getElementById('search')
      .value
      .toLowerCase();

  const container =
    document.getElementById('events');

  container.innerHTML = '';


data

  .filter(event => {

    return (

      event.title
        ?.toLowerCase()
        .includes(search)

      ||

      event.location
        ?.toLowerCase()
        .includes(search)

    );

  })

.sort((a, b) => {

  if (a.recurring && !b.recurring) {
    return -1;
  }

  if (!a.recurring && b.recurring) {
    return 1;
  }

  if (a.recurring && b.recurring) {
    return a.title.localeCompare(b.title);
  }

  const now = new Date();

  const aDate =
    new Date(a.date);

  const bDate =
    new Date(b.date);

  const aPast =
    aDate < now;

  const bPast =
    bDate < now;

  if (!aPast && bPast) {
    return -1;
  }

  if (aPast && !bPast) {
    return 1;
  }

  if (!aPast && !bPast) {

    return aDate - bDate;

  }

  return bDate - aDate;

})


.forEach((event, index, array) => {

  const now =
    new Date();

  const eventDate =
    event.date
      ? new Date(event.date)
      : null;

  const isPast =
    eventDate && eventDate < now;

  const previous =
    array[index - 1];

  const previousPast =
    previous?.date
      ? new Date(previous.date) < now
      : false;

  if (
    isPast &&
    !previousPast &&
    !event.recurring
  ) {

    container.innerHTML += `

      <div class="event-separator">

        <span>
          Vergangene Termine
        </span>

      </div>

    `;

  }

      container.innerHTML += `

        <div class="event-card">

          <div class="event-header">

            <div>

              <strong>
                ${event.title}
              </strong>

              <div class="event-meta">

                ${event.recurring
                  ? '🔁 Wiederkehrend'
                  : `
                    📅 ${
                      new Date(event.date)
                        .toLocaleDateString('de-DE', {
                          day: '2-digit',
                          month: '2-digit',
                          year: 'numeric'
                        })
                    }

                    ·

                    🕒 ${
                      new Date(event.date)
                        .toLocaleTimeString('de-DE', {
                          hour: '2-digit',
                          minute: '2-digit'
                        })
                    } Uhr
                  `
                }

                ${event.location
                  ? ' · 📍 ' + event.location
                  : ''
                }

              </div>

            </div>

            <div class="actions">

              <button onclick="openEvent(${event.id})">
                ✏
              </button>

              <button class="delete-button"
                      onclick="deleteEvent(${event.id})">
                🗑
              </button>

            </div>

          </div>

        </div>

      `;

    });

}

async function deleteEvent(id) {

  const confirmDelete =
    confirm('Termin löschen?');

  if (!confirmDelete) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('Termine')
      .delete()
      .eq('id', id);

  if (error) {

    console.error(error);

    return;

  }

  loadEvents();

}

function newEvent() {

  window.location.href =
    '/admin/termine/event.html';

}

function openEvent(id) {

  window.location.href =
    '/admin/termine/event.html?id=' + id;

}

async function checkSession() {

  const { data } =
    await supabaseClient.auth
      .getSession();

  if (!data.session) {

    window.location.href =
      '/admin/';

    return;

  }

  loadEvents();

}

checkSession();

</script>

</body>

</html>
